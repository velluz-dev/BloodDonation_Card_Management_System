# ---------------------------------------------------------------------------
# Database connection for the Blood Donation Card Management System.
#
# Every value here can be overridden at runtime with a JVM system property of
# the same name, so a deployment can be repointed without rebuilding the WAR:
#     -Dbdcms.db.url=jdbc:mysql://dbhost:3306/bdcms -Dbdcms.db.password=secret
# ---------------------------------------------------------------------------

bdcms.db.driver=com.mysql.cj.jdbc.Driver
bdcms.db.url=jdbc:mysql://127.0.0.1:3307/bdcms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
bdcms.db.username=root
bdcms.db.password=bdcms

# HikariCP pool sizing
bdcms.db.pool.max=10
bdcms.db.pool.minIdle=2
bdcms.db.pool.timeoutMs=10000
