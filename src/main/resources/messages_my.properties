# ---------------------------------------------------------------------------
# Interface text - Myanmar (Burmese).
#
# ⚠ TRANSLATION REVIEW NEEDED. These were written to get the interface working
# in Burmese end to end; they have not been checked by a native speaker. Terms
# to look at first, because getting them wrong changes meaning rather than just
# reading awkwardly:
#
#   common.eligible / common.notEligible   the donate / do-not-donate verdict
#   verify.confirmLabel                    what staff are attesting to
#   verify.instruction                     the comparison procedure
#   settings.careBody                      a donor-safety warning
#   donor.deleteNote                       what deletion does and does not remove
#
# Correct anything here and it changes everywhere at once - that is why the
# strings live in this file rather than in the JSPs.
#
# Encoding is UTF-8. Java 9 and newer read property bundles as UTF-8 by
# default, so the Burmese below needs no \\u escaping.
#
# Any key missing here falls back to messages.properties (English) rather than
# showing a raw key.
# ---------------------------------------------------------------------------

