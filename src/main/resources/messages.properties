# ---------------------------------------------------------------------------
# Interface text - English (default).
#
# This is the fallback bundle: any key missing from messages_my.properties
# falls back to the value here rather than showing the raw key, so a partial
# translation degrades to English instead of to nonsense.
#
# Apostrophes: MessageFormat treats ' as a quoting character, but JSTL only
# runs MessageFormat on a message that actually has <fmt:param> children. So a
# message WITHOUT parameters takes a single apostrophe, and a message WITH
# parameters must double it ('') or the text after it is silently swallowed.
# Adding a parameter to an existing message means checking its apostrophes.
#
# Keys are grouped by screen and named <screen>.<thing>. Shared wording lives
# under common.* so a term is translated once and stays consistent - "donor"
# reading two different ways on two screens is how a translated interface
# starts to feel unreliable.
# ---------------------------------------------------------------------------

