# ---------------------------------------------------------------------------
# Deployment settings.
#
# Business rules that a centre may want to change while the system is running -
# most importantly the minimum donation interval - are NOT here. They live in
# the `settings` database table and are read through SettingsService, so they
# can be edited from the admin screen without a redeployment.
# ---------------------------------------------------------------------------

# Where donor photographs are written. ${user.home} is expanded at runtime.
bdcms.upload.dir=${user.home}/bdcms-uploads

# Largest accepted donor photograph (2 MB).
bdcms.upload.maxPhotoBytes=2097152

# BCrypt work factor for staff passwords and donor PINs.
bdcms.security.bcryptCost=12

# Centre name pre-filled on the donation form.
bdcms.centre.name=Central Blood Bank

# Lists the seeded demonstration accounts on the sign-in page, with click-to-fill.
# Set to false for any real deployment - publishing passwords on a login page is
# defensible only while every account is seeded and every donor is invented.
# Can also be overridden without a rebuild: -Dbdcms.demo.credentials=false
bdcms.demo.credentials=true
